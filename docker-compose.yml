services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: patchwork
      POSTGRES_PASSWORD: patchwork
      POSTGRES_DB: patchwork
    ports:
      - '5433:5432'
    volumes:
      - patchwork_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U patchwork -d patchwork']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  patchwork_postgres_data:
